<!DOCTYPE html>
<html>
  <head>
    <title>Test CSS margin auto</title>
    <style>
      div {height:100px}
      .container {width:300px; background: lightgreen}
      .child {width:100px; background: brown; margin:auto }
      .override {margin-left:0; margin-right:0 }
      .grandchild {width:50px; background: red }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="child"><div class="grandchild"></div></div>
      <div class="child override"></div>
    </div>
  </body>
</html>
